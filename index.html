<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daevaforge – AION 2 Build Planner: Skills, Stigma & Daevanion</title>
    <meta name="description" content="Daevaforge – free AION 2 build planner: skills and specialisations, stigmas, Daevanion boards, hotbar and macro, combos, skill database and class guides. English and German." />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daevaforge" />
    <meta property="og:title" content="Daevaforge – AION 2 Build Planner" />
    <meta property="og:description" content="Forge your AION 2 build: skills and specialisations, stigmas, Daevanion boards, hotbar and macro, combos and class guides. English & Deutsch." />
    <meta property="og:url" content="https://cosmic-game-studios.github.io/aion2-toolkit/" />
    <meta property="og:image" content="https://cosmic-game-studios.github.io/aion2-toolkit/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Daevaforge logo with a row of skill icons" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Start downloading the big game data files while the app code loads (same request as the app makes later),
      // and set the page language early. Language: saved choice, else the browser language.
      (function () {
        var l = null;
        try { l = JSON.parse(localStorage.getItem('aion2tk:lang') || 'null'); } catch (e) { l = null; }
        if (l !== 'en' && l !== 'de') l = (navigator.language || '').toLowerCase().indexOf('de') === 0 ? 'de' : 'en';
        document.documentElement.lang = l;
        ['skills', 'daevanion'].forEach(function (f) {
          var k = document.createElement('link');
          k.rel = 'preload'; k.as = 'fetch'; k.crossOrigin = 'anonymous'; k.href = './data/' + l + '/' + f + '.json';
          document.head.appendChild(k);
        });
      })();
    </script>
    <style>
      /* shown until the app has started (replaced by React) */
      .boot-screen { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; background: #0b0e14; color: #8b96a9; font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; }
      .boot-screen strong { font: 700 28px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: .04em; color: #f3e6c8; }
      .boot-screen i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #263044; border-top-color: #5fb4ff; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-screen i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status"><strong>Daevaforge</strong><i aria-hidden="true"></i><span>AION 2 build planner · Build-Planer</span></div></div>
    <noscript>Daevaforge needs JavaScript. / Daevaforge braucht JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
