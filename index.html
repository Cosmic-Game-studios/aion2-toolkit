<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daevaforge – AION 2 Build Planner: Skills, Stigma & Daevanion</title>
    <meta name="description" content="Daevaforge – free AION 2 build planner: skills and specialisations, stigmas, Daevanion boards, hotbar and macro, combos, skill database and class guides. English and German." />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daevaforge" />
    <meta property="og:title" content="Daevaforge – AION 2 Build Planner" />
    <meta property="og:description" content="Forge your AION 2 build: skills and specialisations, stigmas, Daevanion boards, hotbar and macro, combos and class guides. English & Deutsch." />
    <meta property="og:url" content="https://cosmic-game-studios.github.io/aion2-toolkit/" />
    <meta property="og:image" content="https://cosmic-game-studios.github.io/aion2-toolkit/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Start downloading the big game data files while the app code loads (same request as the app makes later),
      // and set the page language early. Language: saved choice, else the browser language.
      (function () {
        var l = null;
        try { l = JSON.parse(localStorage.getItem('aion2tk:lang') || 'null'); } catch (e) { l = null; }
        if (l !== 'en' && l !== 'de') l = (navigator.language || '').toLowerCase().indexOf('de') === 0 ? 'de' : 'en';
        document.documentElement.lang = l;
        ['skills', 'daevanion'].forEach(function (f) {
          var k = document.createElement('link');
          k.rel = 'preload'; k.as = 'fetch'; k.crossOrigin = 'anonymous'; k.href = './data/' + l + '/' + f + '.json';
          document.head.appendChild(k);
        });
      })();
    </script>
    <style>
      /* shown until the app has started (replaced by React): a gold rune ring around a glowing diamond, the name with a
         light running over it and a thin loading line. Fades in after a moment, so a fast start shows no flash. */
      .boot-screen { min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 16px; background: radial-gradient(55% 45% at 50% 45%, rgba(227, 184, 102, .09), transparent 70%), #0b0e14; color: #8b96a9; font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; }
      .boot-screen > * { animation: boot-in .45s ease-out .15s backwards; }
      .boot-mark { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
      .boot-mark::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; border: 1px solid rgba(227, 184, 102, .25); }
      .boot-mark i { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(transparent 0 28%, #b98a3c 62%, #f6d999); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); filter: drop-shadow(0 0 8px rgba(227, 184, 102, .6)); animation: boot-spin 1.1s linear infinite; }
      .boot-mark b { width: 14px; height: 14px; transform: rotate(45deg); background: linear-gradient(135deg, #fff3cf, #e3b866 55%, #b98a3c); box-shadow: 0 0 18px rgba(227, 184, 102, .8); animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-screen strong { font: 700 30px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: .06em; color: #f3e6c8; background: linear-gradient(100deg, #e9c98a 0 38%, #fff8e6 50%, #e9c98a 62% 100%) 100% 0 / 260% 100% no-repeat; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: boot-in .45s ease-out .15s backwards, boot-shine 2.6s ease-in-out .6s infinite; }
      .boot-bar { position: relative; width: 150px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(227, 184, 102, .14); }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, #f6d999, transparent); animation: boot-bar 1.3s ease-in-out infinite; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px); } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 50% { transform: rotate(45deg) scale(.78); box-shadow: 0 0 8px rgba(227, 184, 102, .45); } }
      @keyframes boot-shine { 0% { background-position: 100% 0; } 45%, 100% { background-position: 0 0; } }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-screen *, .boot-screen *::after { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status"><div class="boot-mark" aria-hidden="true"><i></i><b></b></div><strong>Daevaforge</strong><span class="boot-bar" aria-hidden="true"></span><span>AION 2 build planner · Build-Planer</span></div></div>
    <noscript>Daevaforge needs JavaScript. / Daevaforge braucht JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
